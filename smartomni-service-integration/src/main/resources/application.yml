server:
  port: 8086

spring:
  application:
    name: smartomni-service-integration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    username: smartomni_app
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    user: smartomni_migrator
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: smartomni
    password: ${RABBITMQ_PASSWORD}

smartomni:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    aes-key: ${SMARTOMNI_ENCRYPTION_AES_KEY}
  price-sync:
    fixed-delay-ms: 900000  # 15 phut - UC-43

logging:
  level:
    com.smartomni: DEBUG
