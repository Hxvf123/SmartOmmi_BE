server:
  port: 8087

spring:
  application:
    name: smartomni-service-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    username: smartomni_app
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    user: smartomni_migrator
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

smartomni:
  jwt:
    secret: ${JWT_SECRET}
  ai-python-service:
    base-url: ${PYTHON_AI_BASE_URL:http://localhost:8000}

logging:
  level:
    com.smartomni: DEBUG
