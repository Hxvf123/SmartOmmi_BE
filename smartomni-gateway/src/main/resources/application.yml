server:
  port: 8080

spring:
  application:
    name: smartomni-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: tenant-service
          uri: ${TENANT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/tenants/**,/api/subscription-plans/**,/api/support-tickets/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/products/**,/api/promotions/**,/api/price-sync/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**,/api/returns/**

        - id: integration-service
          uri: ${INTEGRATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/marketplace-connections/**,/webhook/**

        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/ai/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
