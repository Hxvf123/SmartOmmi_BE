server:
  port: 8083

spring:
  application:
    name: smartomni-service-catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    username: smartomni_app
    password: ${DB_APP_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartomni}
    user: smartomni_migrator
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

smartomni:
  jwt:
    secret: ${JWT_SECRET}
  services:
    tenant-url: http://localhost:8082

logging:
  level:
    com.smartomni: DEBUG
